[project]
name = "synthetic-data-agent"
version = "0.1.0"
description = "Multi-agent system for generating high-quality synthetic data for LLM post-training"
readme = "README.md"
authors = [{ name = "Daniel Halwell", email = "danielhalwell@gmail.com" }]
requires-python = ">=3.13"
dependencies = [
    "google-adk>=2.7.1",
    "google-genai>=2.18.1",
    "pydantic>=2.12.5",
    "python-dotenv>=1.1.0",
    "pyyaml>=6.0.2",
    "sqlalchemy>=2.0.45",
]

[project.urls]
Repository = "https://github.com/CodeHalwell/synthetic-data-agent"

[dependency-groups]
dev = [
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-asyncio>=1.0",
    "ruff>=0.12",
]

[tool.uv]
# This repository is a collection of runnable modules (run from the repo root),
# not an installable distribution, so uv only manages its dependencies.
package = false

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["docs"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]
ignore = [
    "E501", # line length is handled by the formatter
    "E402", # modules bootstrap sys.path before imports so they work from any entry point
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"
markers = [
    "integration: exercises live Gemini agents; requires GOOGLE_API_KEY and network access",
]
